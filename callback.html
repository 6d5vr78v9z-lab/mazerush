<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MazeRush — Authorization</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 60px auto;
         padding: 0 20px; color: #222; line-height: 1.6; text-align: center; }
  h1 { color: #4a5aff; }
  code { background: #f0f0f5; padding: 12px 16px; border-radius: 8px;
         display: inline-block; margin-top: 12px; word-break: break-all;
         font-size: 14px; max-width: 100%; }
  .ok { color: #1a9944; font-size: 40px; }
</style>
</head>
<body>
<div class="ok">✓</div>
<h1>Autorización completada</h1>
<p>Copia el código de abajo y pégalo en la terminal donde corre
<strong>tiktok_auth.py</strong>:</p>
<code id="code">…</code>
<script>
  const p = new URLSearchParams(window.location.search);
  document.getElementById("code").textContent =
      p.get("code") || "No se recibió ningún código — reintenta la autorización.";
</script>
</body>
</html>
